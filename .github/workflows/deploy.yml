name: CI / CD — LakePulse

# Tests on every push and pull request; deploys the static page to Cloud Run only on a
# push to main. Pattern and pinned action versions follow the owner's existing website
# workflow. Owner rule: deploys go through this workflow only, never by hand.

on:
  push:
    branches: [main, feat/lake-trend-detective]
  pull_request:
    branches: [main]

env:
  GCP_REGION: us-central1
  ARTIFACT_REGISTRY: us-central1-docker.pkg.dev
  AR_REPO: cloud-run-source-deploy
  SERVICE: lakepulse

permissions:
  contents: read

jobs:
  test:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: requirements*.txt
      - name: Install dependencies
        run: pip install -r requirements-dev.txt
      - name: Run tests
        run: pytest -q

  image:
    name: Build image (no push)
    runs-on: ubuntu-latest
    needs: [test]
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Build
        run: docker build -t lakepulse:ci .
      - name: Smoke test
        run: |
          docker run -d --name lp -p 8080:8080 lakepulse:ci
          for i in $(seq 1 20); do curl -fsS http://127.0.0.1:8080/ >/dev/null && break; sleep 1; done
          curl -fsS http://127.0.0.1:8080/ | grep -q "Lake Trend Detective"
          curl -fsS -o /dev/null http://127.0.0.1:8080/site_data.js
          curl -fsS -o /dev/null http://127.0.0.1:8080/assets/logo-header.png
          curl -fsS http://127.0.0.1:8080/landcover.html | grep -q "Land cover around Lake Simcoe"
          for p in /landcover-data.js /landcover-runtime.js /vendor/d3-7.9.0.min.js; do curl -fsS -o /dev/null "http://127.0.0.1:8080$p"; done
          # Nothing outside web/ may be served (incl. nginx's own sample pages).
          for p in /Dockerfile /deploy/nginx.conf /50x.html /index.nginx-debian.html /data/lake_trend_table.csv /data/landcover_dashboard/manifest.json; do
            code=$(curl -s -o /dev/null -w '%{http_code}' "http://127.0.0.1:8080$p")
            echo "$p -> $code"; test "$code" = "404"
          done
          test "$(curl -s -o /dev/null -w '%{http_code}' --path-as-is 'http://127.0.0.1:8080/../data/lake_trend_table.csv')" = "400"
          docker rm -f lp

  deploy:
    name: Deploy → Cloud Run
    runs-on: ubuntu-latest
    needs: [image]
    if: github.ref_name == 'main' && github.event_name == 'push'
    permissions:
      contents: read
      id-token: write
    env:
      GCP_PROJECT: ${{ vars.GCP_PROJECT_ID }}
    steps:
      - name: Require a configured project (fail closed)
        run: |
          if [ -z "$GCP_PROJECT" ]; then
            echo "::error::Repository variable GCP_PROJECT_ID is not set; nothing deployed."
            exit 1
          fi
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Authenticate to GCP (Workload Identity Federation)
        if: vars.GCP_WIF_PROVIDER != ''
        uses: google-github-actions/auth@c200f3691d83b41bf9bbd8638997a462592937ed # v2.1.13
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SA }}
      - name: Authenticate to GCP (service-account key, until WIF is configured)
        if: vars.GCP_WIF_PROVIDER == ''
        uses: google-github-actions/auth@c200f3691d83b41bf9bbd8638997a462592937ed # v2.1.13
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}
      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@e427ad8a34f8676edf47cf7d7925499adf3eb74f # v2.2.1
      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker ${{ env.ARTIFACT_REGISTRY }} --quiet
      - name: Build and push image
        run: |
          IMAGE=${{ env.ARTIFACT_REGISTRY }}/${GCP_PROJECT}/${{ env.AR_REPO }}/${{ env.SERVICE }}
          docker build -t "$IMAGE:${{ github.sha }}" -t "$IMAGE:latest" .
          docker push "$IMAGE:${{ github.sha }}"
          docker push "$IMAGE:latest"
      - name: Deploy to Cloud Run
        id: deploy
        uses: google-github-actions/deploy-cloudrun@251330ba9a8a34bfbc1622895f42e1d53fd14522 # v2.7.6
        with:
          service: ${{ env.SERVICE }}
          region: ${{ env.GCP_REGION }}
          project_id: ${{ env.GCP_PROJECT }}
          image: ${{ env.ARTIFACT_REGISTRY }}/${{ env.GCP_PROJECT }}/${{ env.AR_REPO }}/${{ env.SERVICE }}:${{ github.sha }}
          flags: |
            --port=8080
            --memory=256Mi
            --cpu=1
            --min-instances=0
            --max-instances=3
            --allow-unauthenticated
            --service-account=lakepulse-run@${{ env.GCP_PROJECT }}.iam.gserviceaccount.com
      - name: Log service URL
        run: echo "Site live at ${{ steps.deploy.outputs.url }}"
