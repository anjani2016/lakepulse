# Serves the static LakePulse page. Read-only content, no forms, no user data.
server {
    listen 8080;
    server_name _;
    root /srv/lakepulse;  # holds only web/ (see Dockerfile)
    index index.html;
    server_tokens off;

    gzip on;
    gzip_types text/css application/javascript text/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Page and data change with each deploy: always revalidate.
    location = / { include /etc/nginx/conf.d/security-headers.inc; add_header Cache-Control "no-cache" always; try_files /index.html =404; }
    location = /index.html { include /etc/nginx/conf.d/security-headers.inc; add_header Cache-Control "no-cache" always; }
    location = /site_data.js { include /etc/nginx/conf.d/security-headers.inc; add_header Cache-Control "no-cache" always; }
    location = /landcover.html { include /etc/nginx/conf.d/security-headers.inc; add_header Cache-Control "no-cache" always; }
    location ~ ^/landcover-(data|runtime)\.js$ { include /etc/nginx/conf.d/security-headers.inc; add_header Cache-Control "no-cache" always; }
    # Logo and icons: cache for a day.
    location /assets/ { include /etc/nginx/conf.d/security-headers.inc; add_header Cache-Control "public, max-age=86400" always; }

    location / { include /etc/nginx/conf.d/security-headers.inc; try_files $uri =404; }
}
