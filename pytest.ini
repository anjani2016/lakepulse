# LakePulse tests. `pythonpath = .` lets a bare `pytest` import the `lakepulse` package
# from the repo root (without it only `python -m pytest` worked). `testpaths = tests`
# keeps collection to LakePulse's own tests; the land-cover track has its own
# landcover/pytest.ini and runs from landcover/ with its own venv.
[pytest]
testpaths = tests
pythonpath = .
